version: 2

seeds:
  - name: seed_region
    description: "NEM region reference: code, name, state, timezone."
    columns:
      - name: region_id
        description: "NEM region id (primary key)."
        data_tests:
          - not_null
          - unique

  - name: seed_fueltech
    description: "Fuel-tech reference: renewable flag + estimated emission factor (curated)."
    columns:
      - name: fueltech
        description: "Normalised fuel-tech key (primary key)."
        data_tests:
          - not_null
          - unique

  - name: seed_engine_benchmark
    description: >
      Point-in-time result of gridlens.benchmark_snowflake_ml — Snowflake ML
      FORECAST vs Python statsforecast on an identical train/holdout split.
      Committed so the finding survives the Snowflake trial and CI rebuilds.

  - name: seed_price_anomalies
    description: >
      Point-in-time result of gridlens.detect_price_anomalies —
      SNOWFLAKE.ML.ANOMALY_DETECTION scores against a 2020-2024 baseline.

  - name: seed_duid_fueltech
    description: "DUID -> fuel-tech mapping, generated from AEMO's Registration & Exemption List."
    columns:
      - name: duid
        description: "Dispatchable unit identifier (primary key)."
        data_tests:
          - not_null
          - unique
