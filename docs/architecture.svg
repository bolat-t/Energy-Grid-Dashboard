<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8dacbf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <!-- header -->
  <text x="24" y="30" font-size="19" font-weight="700" fill="#1f2d3d">GridLens — architecture</text>
  <text x="24" y="50" font-size="12" fill="#5b6b7b">Australia's National Electricity Market: AEMO public data &#8594; dbt &#8594; forecast &#8594; Evidence dashboard, refreshed daily.</text>

  <!-- stage titles -->
  <text x="108" y="84" font-size="12.5" font-weight="600" fill="#236aa4" text-anchor="middle">AEMO sources (no key)</text>
  <text x="291" y="84" font-size="12.5" font-weight="600" fill="#236aa4" text-anchor="middle">Ingest &#183; Python (uv)</text>
  <text x="484" y="84" font-size="12.5" font-weight="600" fill="#236aa4" text-anchor="middle">Transform &#183; dbt Core</text>
  <text x="680" y="84" font-size="12.5" font-weight="600" fill="#236aa4" text-anchor="middle">Analytics</text>
  <text x="879" y="84" font-size="12.5" font-weight="600" fill="#236aa4" text-anchor="middle">Serve</text>

  <!-- S1 sources -->
  <rect x="24" y="98" width="168" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="108" y="124" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Price &amp; demand (5-min)</text>
  <rect x="24" y="150" width="168" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="108" y="176" font-size="11.5" fill="#1f2d3d" text-anchor="middle">NEMWEB SCADA</text>
  <rect x="24" y="202" width="168" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="108" y="228" font-size="11.5" fill="#1f2d3d" text-anchor="middle">DUID &#8594; fuel registry</text>

  <!-- S2 ingest -->
  <rect x="216" y="124" width="150" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="291" y="150" font-size="11.5" fill="#1f2d3d" text-anchor="middle">ingest scripts</text>
  <rect x="216" y="176" width="150" height="42" rx="8" fill="#cfe2f3" stroke="#45a1bf"/>
  <text x="291" y="202" font-size="11.5" font-weight="600" fill="#1f2d3d" text-anchor="middle">DuckDB &#183; raw</text>

  <!-- S3 dbt -->
  <rect x="390" y="124" width="188" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="484" y="150" font-size="11.5" fill="#1f2d3d" text-anchor="middle">staging (views)</text>
  <rect x="390" y="176" width="188" height="42" rx="8" fill="#cfe2f3" stroke="#45a1bf"/>
  <text x="484" y="195" font-size="11.5" font-weight="600" fill="#1f2d3d" text-anchor="middle">marts &#183; dims + facts</text>
  <text x="484" y="210" font-size="9.5" fill="#5b6b7b" text-anchor="middle">73 tests &#183; docs &#183; lineage</text>

  <!-- S4 analytics -->
  <rect x="602" y="124" width="156" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="680" y="150" font-size="11.5" fill="#1f2d3d" text-anchor="middle">statsforecast 7-day</text>
  <rect x="602" y="176" width="156" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="680" y="202" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Parquet export</text>

  <!-- S5 serve -->
  <rect x="782" y="98" width="194" height="42" rx="8" fill="#cfe2f3" stroke="#45a1bf"/>
  <text x="879" y="124" font-size="11.5" font-weight="600" fill="#1f2d3d" text-anchor="middle">Evidence.dev dashboard</text>
  <rect x="782" y="150" width="194" height="42" rx="8" fill="#cfe2f3" stroke="#45a1bf"/>
  <text x="879" y="176" font-size="11.5" font-weight="600" fill="#1f2d3d" text-anchor="middle">Cloudflare Pages (live)</text>
  <rect x="782" y="202" width="194" height="42" rx="8" fill="#eef4fa" stroke="#a5cdee"/>
  <text x="879" y="228" font-size="11.5" fill="#1f2d3d" text-anchor="middle">Power BI (from Parquet)</text>

  <!-- flow arrows -->
  <line x1="192" y1="166" x2="214" y2="166" stroke="#8dacbf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="366" y1="166" x2="388" y2="166" stroke="#8dacbf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="578" y1="166" x2="600" y2="166" stroke="#8dacbf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="758" y1="166" x2="780" y2="166" stroke="#8dacbf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- forecast results loop back into dbt marts -->
  <path d="M680,124 C680,104 484,104 484,122" fill="none" stroke="#c9b48a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="582" y="100" font-size="9.5" fill="#a98a4b" text-anchor="middle">forecast served via dbt</text>

  <!-- orchestration bar -->
  <rect x="24" y="282" width="952" height="44" rx="10" fill="#fdf3e0" stroke="#f4b548" stroke-dasharray="6 4"/>
  <text x="500" y="309" font-size="12.5" font-weight="600" fill="#8a6d2f" text-anchor="middle">GitHub Actions &#8212; daily cron:  ingest &#8594; dbt build &#8594; forecast &#8594; export &#8594; Evidence build &#8594; deploy</text>

  <!-- footnotes -->
  <text x="24" y="352" font-size="11" fill="#5b6b7b">Warehouse: DuckDB (always-on, $0) &#8212; dbt also runs on Snowflake (documented 30-day-trial run).</text>
  <text x="24" y="372" font-size="11" fill="#5b6b7b">Generation = utility-scale (excludes rooftop PV) &#183; carbon intensity estimated from per-fuel factors &#183; data &#169; AEMO (public).</text>
</svg>
