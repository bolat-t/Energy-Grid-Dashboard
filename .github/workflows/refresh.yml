name: refresh

# Daily: pull fresh AEMO data -> dbt -> forecast -> export -> Evidence build
# -> publish the dashboard (GitHub Pages always; Cloudflare Pages if configured).
on:
  schedule:
    - cron: "30 18 * * *" # ~04:30 AEST daily
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Absolute path so dbt (run via --project-dir) and the Python scripts agree.
  ENERGY_GRID_DUCKDB_PATH: ${{ github.workspace }}/data/energy_grid.duckdb
  # Empty unless the Cloudflare secrets are set; used to skip that deploy.
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reports/package-lock.json

      # Restores cached AEMO downloads so only new months are fetched.
      - name: Cache raw AEMO data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rawdata-${{ github.run_id }}
          restore-keys: rawdata-

      - name: Install Python deps (and Python 3.12)
        run: uv sync

      - name: Ingest AEMO price & demand
        run: uv run python -m energy_grid.ingest_price_demand

      - name: Build DUID->fuel seed + ingest generation
        run: |
          uv run python -m energy_grid.build_duid_fueltech_seed
          uv run python -m energy_grid.ingest_generation

      - name: dbt deps
        run: uv run dbt deps --project-dir transform --profiles-dir transform

      - name: dbt build (excluding forecast marts)
        run: >
          uv run dbt build --project-dir transform --profiles-dir transform
          --exclude fct_demand_forecast fct_forecast_accuracy

      - name: Train demand forecast
        run: uv run python -m energy_grid.forecast_demand

      - name: dbt build (full) + export marts
        run: |
          uv run dbt build --project-dir transform --profiles-dir transform
          uv run python -m energy_grid.export_marts

      # Self-contained docs site, published alongside the dashboard at /dbt/.
      # Generated against DuckDB so the docs track the live daily pipeline.
      - name: Generate dbt docs
        run: |
          uv run dbt docs generate --project-dir transform --profiles-dir transform --static
          mkdir -p reports/static/dbt
          cp transform/target/static_index.html reports/static/dbt/index.html

      - name: Install dashboard deps + cache sources
        working-directory: reports
        run: |
          npm ci
          npm run sources

      # GitHub Pages serves this repo at /<repo>, so the site needs a base path.
      - name: Build dashboard for GitHub Pages
        working-directory: reports
        run: |
          printf '\ndeployment:\n  basePath: /%s\n' "${GITHUB_REPOSITORY#*/}" >> evidence.config.yaml
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/build

      # Cloudflare serves at the domain root, so rebuild without the base path.
      # Skipped entirely until CLOUDFLARE_API_TOKEN is set.
      - name: Rebuild for Cloudflare (root path)
        if: env.CF_TOKEN != ''
        working-directory: reports
        run: |
          git checkout -- evidence.config.yaml
          npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy reports/build --project-name=energy-grid-dashboard --branch=main

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
