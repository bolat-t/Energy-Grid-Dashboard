name: diagnose-nemweb

# Temporary: nemweb.com.au directory listings return 200 from GitHub runners but
# the SCADA zip 404s. Determine which '#' encoding that CDN edge accepts.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: What href does the listing actually serve here?
        run: |
          curl -sL -A "Mozilla/5.0 (GridLens)" \
            "https://nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/2025/MMSDM_2025_03/MMSDM_Historical_Data_SQLLoader/DATA/" \
            -o listing.html
          echo "listing bytes: $(wc -c < listing.html)"
          echo "--- href containing DISPATCH_UNIT_SCADA ---"
          grep -oiE 'href="[^"]*DISPATCH_UNIT_SCADA[^"]*"' listing.html | head -2 || echo "  (none found)"

      - name: Try each encoding of '#'
        run: |
          BASE="https://nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/2025/MMSDM_2025_03/MMSDM_Historical_Data_SQLLoader/DATA"
          FILE_2523="PUBLIC_ARCHIVE%2523DISPATCH_UNIT_SCADA%2523FILE01%2523202503010000.zip"
          FILE_23="PUBLIC_ARCHIVE%23DISPATCH_UNIT_SCADA%23FILE01%23202503010000.zip"
          for f in "$FILE_2523" "$FILE_23"; do
            echo "--- $f ---"
            curl -sIL --path-as-is -o /dev/null \
              -w "  http=%{http_code} size=%{size_download} type=%{content_type}\n" \
              -A "Mozilla/5.0 (GridLens)" "$BASE/$f" || true
          done

      - name: Try the exact href from the listing
        run: |
          HREF=$(grep -oiE 'href="[^"]*DISPATCH_UNIT_SCADA[^"]*"' listing.html | head -1 | sed 's/^[hH][rR][eE][fF]="//; s/"$//')
          echo "href: $HREF"
          if [ -n "$HREF" ]; then
            case "$HREF" in
              http*) URL="$HREF" ;;
              *)     URL="https://nemweb.com.au$HREF" ;;
            esac
            echo "resolved: $URL"
            curl -sIL --path-as-is -o /dev/null \
              -w "  http=%{http_code} size=%{size_download} type=%{content_type}\n" \
              -A "Mozilla/5.0 (GridLens)" "$URL" || true
          fi
